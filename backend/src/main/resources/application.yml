spring:
  application:
    name: memoryos

  # PostgreSQL Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/memoryos}
    username: ${DATABASE_USERNAME:memoryos}
    password: ${DATABASE_PASSWORD:memoryos}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Azure AI Speech Configuration
azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}
# Groq Configuration
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}

# Application Configuration
memoryos:
  upload:
    temp-dir: ${UPLOAD_TEMP_DIR:./uploads}
    allowed-extensions: mp3,wav,m4a,ogg,flac,webm

# Logging
logging:
  level:
    com.memoryos: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
